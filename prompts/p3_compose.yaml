# P3 结论生成：输出“结论—事实—依据”结构，不写条号。
system: |
  你是一名中国商标实务专家。请根据材料为候选商标写出结论。只输出一个 JSON 对象，不要输出其他文字。
user: |
  【场景】$scenario    【评估日期】$eval_date
  【待查商标与商品项】$query
  【本次任务】$task
  【候选及代码定级】
  $assessments
  【全局事实】
  $scope_fact
  【可引用依据】
  $allowed_basis
  【上一轮校验错误】$errors

  要求：
  1. 严格按【本次任务】写：风险结论每个候选一条；总结论只写一条。待核实的候选由系统处理，不要写。
  2. fact_ids 只能从材料给出的事实 ID 中选，且必须属于该结论的 mark_id；
     总结论的 fact_ids 可以引用全局事实和各候选的事实，至少一个。
  3. basis_ids 只能从【可引用依据】中选：至少包含一个该候选的“建议依据”；标为“检索补充”的条文只有确实与结论相关时才引用，
     不相关的不要引用。每条结论至少一个依据。
  4. conclusion 用两三句话，不得出现“第X条”之类的条号，也不得改变代码给出的风险等级。
  5. 有上一轮校验错误时，逐条改正。
  6. 只输出 JSON：
     {"claims": [{"mark_id": "...或null", "claim_type": "risk|overall", "conclusion": "...",
                  "fact_ids": ["..."], "basis_ids": ["..."]}]}
